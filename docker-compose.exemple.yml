services:
  app:
    restart: always
    container_name: firebase_push_app
    hostname: firebase
    image: firebase_push
    build:
      context: .
      dockerfile: ./dockerfile
    environment:
      IS_DOCKER: "true"
      NODE_ENV: "production"
    ports:
      - "127.0.0.1:3000:3000"

  redis:
    restart: always
    container_name: firebase_push_redis
    hostname: redis
    image: redis:8-alpine
    command: redis-server --appendonly yes --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data

volumes:
  redis-data:
    driver: local
